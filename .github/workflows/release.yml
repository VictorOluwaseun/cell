name: macOS release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Build-only version, such as 1.2.0-beta.1 (does not create a tag or release)'
        required: true
        default: '1.1.0'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      signing: ${{ steps.metadata.outputs.signing }}
    env:
      CELL_SIGNING: ${{ vars.MACOS_SIGNING || 'adhoc' }}
      CELL_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate version and release mode
        id: metadata
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: python3 scripts/release.py metadata --version "$RELEASE_VERSION"
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test calculations, persistence and release validation
        run: |
          ./scripts/swift.sh test
          python3 -m unittest discover -s Tests/ReleaseTests -v
      - name: Prepare temporary signing keychain
        if: env.CELL_SIGNING == 'developer-id'
        env:
          MACOS_APPLICATION_CERTIFICATE: ${{ secrets.MACOS_APPLICATION_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: bash scripts/ci-signing.sh prepare
      - name: Build universal app, PKG, DMG and ZIP
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          CELL_SIGNING_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          CELL_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          CELL_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          CELL_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: python3 scripts/release.py build --version "$RELEASE_VERSION" --output dist/release
      - name: Upload complete release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cell-macos-release
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload notarization diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notarization-diagnostics
          path: .build/release-logs/*
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary certificates and key
        if: always()
        run: bash scripts/ci-signing.sh cleanup

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cell-macos-release
          path: release
      - name: Verify complete downloads
        working-directory: release
        run: shasum -a 256 -c SHA256SUMS
      - name: Publish only after every asset is uploaded
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.build.outputs.prerelease }}
          RELEASE_SIGNING: ${{ needs.build.outputs.signing }}
        shell: bash
        run: |
          set -euo pipefail
          title="Cell $RELEASE_VERSION"
          if [ "$RELEASE_SIGNING" = adhoc ]; then title="$title (unsigned)"; fi
          options=()
          if [ "$RELEASE_PRERELEASE" = true ]; then options+=(--prerelease); fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then echo 'This tag already has a published release; refusing to replace it.' >&2; exit 1; fi
            gh release edit "$RELEASE_TAG" --title "$title" --notes-file RELEASE-NOTES.md
            gh release upload "$RELEASE_TAG" ./* --clobber
          else
            gh release create "$RELEASE_TAG" ./* --verify-tag --draft --title "$title" --notes-file RELEASE-NOTES.md --generate-notes "${options[@]}"
          fi
          gh release edit "$RELEASE_TAG" --draft=false "${options[@]}"
